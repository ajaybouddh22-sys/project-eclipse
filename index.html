<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#090b12;--panel:#111522;--panel2:#171d2d;--line:#252d40;--text:#eef1fb;--muted:#98a2b8;--accent:#a78bfa;--accent2:#6ee7b7;--danger:#fb7185;--gold:#fbbf24;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#211b3b 0,transparent 30%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#0d101a;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:8px 10px 24px}.brand small{color:var(--muted);letter-spacing:2px;font-size:10px}.brand h1{margin:5px 0;font-size:20px;letter-spacing:1.5px}.brand p{color:var(--muted);font-size:12px;margin:0}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:12px;text-align:left;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:#211d37;color:#fff}.nav .ico{width:22px;text-align:center}.sidefoot{position:absolute;bottom:20px;left:26px;color:#68738a;font-size:11px}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800}.top h2{font-size:25px;margin:4px 0}.date{color:var(--muted);font-size:13px}.pill{border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--accent2);font-size:12px;background:#111a1b}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:linear-gradient(145deg,rgba(24,30,47,.96),rgba(15,19,31,.96));border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}.card h3{margin:0 0 5px;font-size:15px}.muted{color:var(--muted)}.big{font-size:30px;font-weight:800;letter-spacing:-1px}.sub{font-size:12px;color:var(--muted)}.hero{background:linear-gradient(115deg,#211b3c,#151c31 65%,#102b2a);padding:25px;border-radius:22px;border:1px solid #393052;margin-bottom:17px}.hero h2{font-size:28px;margin:5px 0}.hero p{color:#c0bfd4;margin:0}.hero-row{display:flex;justify-content:space-between;align-items:center;gap:20px}.progress{height:8px;background:#293044;border-radius:99px;overflow:hidden;margin:12px 0 5px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.statlabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.tile{display:flex;gap:13px;align-items:flex-start;cursor:pointer;transition:.15s}.tile:hover{transform:translateY(-2px);border-color:#65549c}.tile .emoji{font-size:23px}.tile p{margin:3px 0 0;color:var(--muted);font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px;gap:10px}.section-title h3{margin:0;font-size:16px}.btn{border:1px solid var(--line);background:#20283b;color:var(--text);padding:9px 13px;border-radius:11px}.btn:hover{border-color:var(--accent)}.primary{background:linear-gradient(100deg,#7c5ce7,#5c8ce9);border:0;color:white}.ghost{background:transparent}.danger{color:var(--danger)}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#0d1220;border:1px solid var(--line);border-radius:10px;padding:10px 11px;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:90px;resize:vertical}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row .btn{flex:0 0 auto}.list{display:grid;gap:9px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:#101625}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:10px;color:var(--accent2);border:1px solid #28574e;padding:3px 8px;border-radius:99px;white-space:nowrap}.tag.pending{color:var(--gold);border-color:#6b5523}.tag.done{color:var(--accent2);border-color:#28574e}.tag.progressing{color:var(--accent);border-color:#55427d}.smallbtn{font-size:11px;padding:5px 8px;border-radius:8px}.timer{font-size:54px;font-weight:800;letter-spacing:2px;text-align:center;margin:16px 0}.timer-ring{width:230px;height:230px;border-radius:50%;border:8px solid #282b43;display:grid;place-items:center;margin:20px auto;background:radial-gradient(circle,#191b30,#101421)}.timer-ring .timer{margin:0}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 11px;border-radius:9px}.tabs button.active{background:#292344;color:#fff;border-color:#62508f}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.hide{display:none!important}.checkline{display:flex;gap:9px;align-items:center}.checkline input{width:auto}.chapter{display:flex;justify-content:space-between;gap:8px;align-items:center}.chapter select{width:auto;max-width:130px;padding:6px}.toast{position:fixed;bottom:20px;right:20px;background:#1b2540;border:1px solid #4b5680;padding:12px 16px;border-radius:12px;display:none;z-index:9}.footer-note{color:#64708a;font-size:11px;margin-top:20px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px;z-index:10}.modal.open{display:grid}.modalbox{width:min(520px,100%);background:#131a2a;border:1px solid var(--line);border-radius:18px;padding:20px;max-height:90vh;overflow:auto}
@media(max-width:950px){.app{grid-template-columns:1fr}.side{height:auto;position:sticky;z-index:5;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:5px 8px 9px}.brand h1{font-size:16px}.brand p,.brand small,.sidefoot{display:none}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;padding:9px 11px;font-size:12px}.main{padding:18px 14px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}.hero-row{display:block}.top{align-items:flex-start}.top h2{font-size:21px}.timer-ring{width:205px;height:205px}.timer{font-size:44px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
 <div class="brand"><small>PERSONAL STUDY OPERATING SYSTEM</small><h1>◈ PROJECT ECLIPSE</h1><p>Disappear. Discipline. Dominate.</p></div>
 <nav class="nav" id="nav">
  <button class="active" data-page="home"><span class="ico">⌂</span>Dashboard</button>
  <button data-page="lectures"><span class="ico">▶</span>Lecture Room</button>
  <button data-page="practice"><span class="ico">✓</span>Practice Arena</button>
  <button data-page="library"><span class="ico">▤</span>Study Library</button>
  <button data-page="ai"><span class="ico">✧</span>AI Study Room</button>
  <button data-page="focus"><span class="ico">◷</span>Focus Mode</button>
  <button data-page="planner"><span class="ico">▦</span>My Planner</button>
  <button data-page="syllabus"><span class="ico">☷</span>Syllabus Tracker</button>
  <button data-page="roadmap"><span class="ico">⌁</span>100-Day Roadmap</button>
  <button data-page="mistakes"><span class="ico">✎</span>Mistake Notebook</button>
  <button data-page="notes"><span class="ico">▧</span>My Notes</button>
  <button data-page="analytics"><span class="ico">▥</span>Analytics</button>
  <button data-page="customize"><span class="ico">⚙</span>Customize</button>
 </nav>
 <div class="sidefoot">LOCAL SAVE ENABLED · YOUR DEVICE</div>
</aside>
<main class="main">
 <header class="top"><div><div class="eyebrow">YOUR COMMAND CENTER</div><h2 id="pageTitle">Dashboard</h2><div class="date" id="todayLabel"></div></div><div class="pill" id="dayPill">DAY 01 / 100</div></header>
 <section id="content"></section>
 <div class="footer-note">Your progress is saved in this browser on this device. Export a backup regularly from Customize.</div>
</main>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const $=s=>document.querySelector(s);
const todayISO=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>new Date(d+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
const defaultData={
 startDate:"2026-11-19",goal:"95%+",name:"Ajay",
 subjects:[
  {name:"Maths",chapters:Array.from({length:4},(_,i)=>({name:"Pending chapter "+(i+1),status:"Pending"}))},
  {name:"Science",chapters:Array.from({length:6},(_,i)=>({name:"Pending chapter "+(i+1),status:"Pending"}))},
  {name:"History",chapters:Array.from({length:5},(_,i)=>({name:"History chapter "+(i+1),status:i===0?"In Progress":"Pending"}))},
  {name:"Geography",chapters:Array.from({length:7},(_,i)=>({name:"Geography chapter "+(i+1),status:"Pending"}))},
  {name:"Political Science",chapters:Array.from({length:5},(_,i)=>({name:"Political Science chapter "+(i+1),status:"Pending"}))},
  {name:"Economics",chapters:Array.from({length:5},(_,i)=>({name:"Economics chapter "+(i+1),status:"Pending"}))},
  {name:"Hindi",chapters:[{name:"Syllabus completed — revision pending",status:"In Progress"}]},
  {name:"English",chapters:[{name:"Syllabus completed — revision pending",status:"In Progress"}]},
  {name:"Sanskrit",chapters:[{name:"Syllabus completed — revision pending",status:"In Progress"}]}
 ],
 tasks:[],mistakes:[],notes:[],lectures:[],resources:[],sessions:[],customTools:[],
 dailyChecks:{}
};
let data;
try{data={...defaultData,...JSON.parse(localStorage.getItem("eclipseData")||"{}")};}catch(e){data=structuredClone(defaultData)}
function save(){localStorage.setItem("eclipseData",JSON.stringify(data));}
function toast(t){let x=$("#toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2200)}
function dayNum(){let a=new Date(data.startDate+"T00:00:00"),b=new Date();return Math.max(1,Math.min(100,Math.floor((b-a)/86400000)+1))}
function allChapters(){return data.subjects.flatMap(s=>s.chapters.map(c=>({...c,subject:s.name})))}
function stats(){let a=allChapters(),done=a.filter(x=>x.status==="Completed").length;return {total:a.length,done,pct:a.length?Math.round(done/a.length*100):0}}
function nav(p){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render(p)}
$("#nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)nav(b.dataset.page)});
$("#todayLabel").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function shell(title,html){$("#pageTitle").textContent=title;$("#dayPill").textContent=`DAY ${String(dayNum()).padStart(2,"0")} / 100` ;$("#content").innerHTML=html}
function card(title,body,sub=""){return `<div class="card"><div class="statlabel">${sub}</div><h3>${title}</h3>${body}</div>`}
function render(page="home"){
 const s=stats(),dn=dayNum(),remaining=Math.max(0,100-dn),totalSessions=data.sessions.length;
 if(page==="home"){
 shell("Dashboard",`
 <div class="hero"><div class="hero-row"><div><div class="eyebrow">PROJECT ECLIPSE · MISSION ACTIVE</div><h2>Welcome back, ${esc(data.name||"Student")}.</h2><p>Disappear from distractions. Show up for your goals.</p></div><div class="pill">TARGET ${esc(data.goal)}</div></div><div class="progress"><span style="width:${dn}%"></span></div><div class="row"><span class="sub">Day ${dn} of 100</span><span class="sub">${remaining} days remaining</span></div></div>
 <div class="grid g4">${card("Syllabus progress",`<div class="big">${s.pct}%</div><div class="sub">${s.done}/${s.total} chapters completed</div>`)}${card("Mission day",`<div class="big">${dn}/100</div><div class="sub">Started ${fmtDate(data.startDate)}</div>`)}${card("Study sessions",`<div class="big">${totalSessions}</div><div class="sub">Sessions recorded</div>`)}${card("Mistakes logged",`<div class="big">${data.mistakes.length}</div><div class="sub">Learn, correct, improve</div>`)}</div>
 <div class="section-title"><h3>ALL-IN-ONE STUDY SPACE</h3></div>
 <div class="grid g3">${tile("▶","Lecture Room","Video lessons & saved links","lectures")}${tile("✓","Practice Arena","Tests, MCQs & self-practice","practice")}${tile("▤","Study Library","Books, PDFs & resources","library")}${tile("✧","AI Study Room","Open your AI study helper","ai")}${tile("◷","Focus Mode","Timer, stopwatch & sessions","focus")}${tile("▦","My Planner","Daily schedule & tasks","planner")}${tile("☷","Syllabus Tracker","Subject-wise chapter status","syllabus")}${tile("⌁","100-Day Roadmap","Mission milestones & daily goals","roadmap")}${tile("✎","Mistake Notebook","Log errors with date and time","mistakes")}${tile("▧","My Notes","Personal notes and revision","notes")}${tile("▥","Analytics","Study history and progress","analytics")}${tile("⚙","Customize","Edit your study space","customize")}</div>
 <div class="section-title"><h3>Today's tasks</h3><button class="btn smallbtn" onclick="nav('planner')">Open planner →</button></div><div class="list">${todayTasksHTML()}</div>`);
 }else if(page==="focus"){
 shell("Focus Mode",`<div class="grid g2"><div class="card"><div class="statlabel">POMODORO TIMER</div><h3>Focus session</h3><div class="tabs"><button class="active" onclick="setTimer(25,this)">25 min</button><button onclick="setTimer(45,this)">45 min</button><button onclick="setTimer(50,this)">50 min</button><button onclick="setTimer(5,this)">5 min break</button></div><div class="timer-ring"><div class="timer" id="timerDisplay">25:00</div></div><div class="row"><button class="btn primary" id="timerStart" onclick="toggleTimer()">Start</button><button class="btn" onclick="resetTimer()">Reset</button></div><p class="sub" id="timerStatus">Ready when you are. Choose a duration and start.</p></div><div class="card"><div class="statlabel">STOPWATCH</div><h3>Track open-ended study time</h3><div class="timer" id="stopDisplay">00:00:00</div><div class="row"><button class="btn primary" onclick="stopwatchToggle()" id="stopBtn">Start</button><button class="btn" onclick="stopwatchReset()">Reset</button></div><hr style="border-color:var(--line);margin:22px 0"><h3>Save a study session</h3><div class="field"><label>Subject</label><select id="sessionSubject">${data.subjects.map(x=>`<option>${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>What did you study?</label><input id="sessionTopic" placeholder="e.g. Electricity numericals"></div><button class="btn primary" onclick="saveSession()">Save session</button></div></div><div class="section-title"><h3>Recent sessions</h3></div><div class="list">${data.sessions.slice(-8).reverse().map(x=>`<div class="item"><div class="itemtop"><b>${esc(x.subject)} · ${esc(x.topic||"Study session")}</b><span class="tag">${esc(x.duration||"Timer")}</span></div><div class="sub">${esc(x.date)} · ${esc(x.time)}</div></div>`).join("")||'<div class="empty">No sessions saved yet.</div>'}</div>`);
 }else if(page==="syllabus"){
 shell("Syllabus Tracker",`<div class="hero"><div class="eyebrow">YOUR SYLLABUS STATUS</div><h2>${s.pct}% completed</h2><div class="progress"><span style="width:${s.pct}%"></span></div><p>${s.done} of ${s.total} chapters marked complete. Edit chapter names to match your exact MP Board syllabus.</p></div><div class="section-title"><h3>Subjects & chapters</h3><button class="btn primary" onclick="addChapter()">+ Add chapter</button></div>${data.subjects.map((sub,si)=>`<div class="card" style="margin-bottom:12px"><div class="itemtop"><h3>${esc(sub.name)}</h3><span class="tag">${sub.chapters.filter(c=>c.status==="Completed").length}/${sub.chapters.length} done</span></div><div class="list" style="margin-top:10px">${sub.chapters.map((c,ci)=>`<div class="item chapter"><input style="max-width:44%;padding:7px" value="${esc(c.name)}" onchange="renameChapter(${si},${ci},this.value)"><select onchange="setChapter(${si},${ci},this.value)"><option ${c.status==="Pending"?"selected":""}>Pending</option><option ${c.status==="In Progress"?"selected":""}>In Progress</option><option ${c.status==="Completed"?"selected":""}>Completed</option></select><button class="btn smallbtn ghost danger" onclick="deleteChapter(${si},${ci})">×</button></div>`).join("")}</div></div>`).join("")}`);
 }else if(page==="roadmap"){
 const phases=[["PHASE 1 · FOUNDATION","Day 1–22","Complete remaining syllabus","19 Nov – 10 Dec 2026"],["PHASE 2 · REBUILD","Day 23–47","First full revision","11 Dec 2026 – 4 Jan 2027"],["PHASE 3 · THE GRIND","Day 48–72","PYQs, chapter tests & answer writing","5 Jan – 29 Jan 2027"],["PHASE 4 · FINAL COUNTDOWN","Day 73–100","Sample papers & final revision","30 Jan – 26 Feb 2027"]];
 shell("100-Day Roadmap",`<div class="hero"><div class="eyebrow">THE MISSION</div><h2>100 days. One direction.</h2><p>Current position: Day ${dn}. Keep moving with consistency.</p></div><div class="list">${phases.map((p,i)=>`<div class="card"><div class="itemtop"><span class="tag ${dn>(i===0?22:i===1?47:i===2?72:100)?"done":dn>=[1,23,48,73][i]?"progressing":"pending"}">${p[1]}</span><span class="sub">${p[3]}</span></div><h3 style="margin-top:12px">${p[0]}</h3><p class="muted">${p[2]}</p></div>`).join("")}</div><div class="section-title"><h3>Daily mission checklist</h3></div><div class="card"><div class="sub">Tick these when completed. Resets by date automatically.</div>${["Maths target","Science target","Language revision","3-hour SST session","Mistake review","Sleep routine"].map((x,i)=>`<div class="checkline" style="margin:12px 0"><input type="checkbox" ${((data.dailyChecks[todayISO()]||[]).includes(i))?"checked":""} onchange="toggleDaily(${i},this.checked)"><label>${x}</label></div>`).join("")}</div>`);
 }else if(page==="planner"){
 shell("My Planner",`<div class="grid g2"><div class="card"><h3>Add a task</h3><div class="field"><label>Task</label><input id="taskText" placeholder="e.g. Revise Carbon and its Compounds"></div><div class="row"><div class="field"><label>Subject</label><select id="taskSubject">${data.subjects.map(x=>`<option>${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>Date</label><input type="date" id="taskDate" value="${todayISO()}"></div></div><button class="btn primary" onclick="addTask()">Add to planner</button></div><div class="card"><h3>Daily routine</h3><p class="muted">Edit your routine in Customize or add tasks for a specific date.</p><div class="list"><div class="item">☀️ Daytime · Maths, Science & languages</div><div class="item">🌙 Night · 3 hours dedicated to SST</div><div class="item">💤 Sleep · Protect your rest</div></div></div></div><div class="section-title"><h3>Tasks for today</h3></div><div class="list">${todayTasksHTML()}</div><div class="section-title"><h3>All upcoming tasks</h3></div><div class="list">${data.tasks.filter(t=>t.date!==todayISO()).sort((a,b)=>a.date.localeCompare(b.date)).map((t,i)=>taskHTML(t,i)).join("")||'<div class="empty">No upcoming tasks.</div>'}</div>`);
 }else if(page==="mistakes"){
 shell("Mistake Notebook",`<div class="grid g2"><div class="card"><h3>Log a mistake</h3><div class="field"><label>Subject</label><select id="mistSubject">${data.subjects.map(x=>`<option>${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>Chapter / topic</label><input id="mistTopic" placeholder="Which chapter?"></div><div class="field"><label>What was the mistake?</label><textarea id="mistError" placeholder="Write what went wrong..."></textarea></div><div class="field"><label>Correct method / lesson</label><textarea id="mistFix" placeholder="Write the correct approach..."></textarea></div><button class="btn primary" onclick="addMistake()">Save mistake with date & time</button></div><div class="card"><div class="statlabel">LEARN FROM EVERY ERROR</div><div class="big">${data.mistakes.length}</div><p class="muted">Mistakes recorded</p><div class="big">${data.mistakes.filter(m=>m.fixed).length}</div><p class="muted">Marked as fixed</p></div></div><div class="section-title"><h3>My mistakes</h3></div><div class="list">${data.mistakes.slice().reverse().map((m,i)=>`<div class="item"><div class="itemtop"><b>${esc(m.subject)} · ${esc(m.topic)}</b><span class="tag ${m.fixed?"done":"pending"}">${m.fixed?"Fixed":"Review again"}</span></div><div class="sub">${esc(m.date)} · ${esc(m.time)}</div><p><b>Mistake:</b> ${esc(m.error)}</p><p><b>Correction:</b> ${esc(m.fix)}</p><button class="btn smallbtn" onclick="toggleMistake(${data.mistakes.length-1-i})">${m.fixed?"Reopen":"Mark fixed"}</button> <button class="btn smallbtn ghost danger" onclick="removeMistake(${data.mistakes.length-1-i})">Delete</button></div>`).join("")||'<div class="empty">Your mistake log is empty. Add the first one when you review your work.</div>'}</div>`);
 }else if(page==="notes"){
 shell("My Notes",`<div class="card"><h3>Create a note</h3><div class="row"><div class="field"><label>Title</label><input id="noteTitle" placeholder="e.g. Electricity — key points"></div><div class="field"><label>Subject</label><select id="noteSubject">${data.subjects.map(x=>`<option>${esc(x.name)}</option>`).join("")}</select></div></div><div class="field"><label>Note</label><textarea id="noteBody" style="min-height:150px" placeholder="Write your notes here..."></textarea></div><button class="btn primary" onclick="addNote()">Save note</button></div><div class="section-title"><h3>Saved notes</h3></div><div class="list">${data.notes.slice().reverse().map((n,i)=>`<div class="item"><div class="itemtop"><b>${esc(n.title)}</b><span class="tag">${esc(n.subject)}</span></div><div class="sub">${esc(n.date)} · ${esc(n.time)}</div><p style="white-space:pre-wrap">${esc(n.body)}</p><button class="btn smallbtn ghost danger" onclick="deleteNote(${data.notes.length-1-i})">Delete</button></div>`).join("")||'<div class="empty">No notes yet.</div>'}</div>`);
 }else if(page==="lectures"){
 shell("Lecture Room",`<div class="card"><h3>Save a lecture</h3><p class="muted">Add a lesson title and a video URL from a source you can access. Links open in a new tab.</p><div class="field"><label>Lecture title</label><input id="lecTitle" placeholder="e.g. Nationalism in India — One Shot"></div><div class="row"><div class="field"><label>Subject</label><select id="lecSubject">${data.subjects.map(x=>`<option>${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>Video / lesson URL</label><input id="lecUrl" placeholder="https://..."></div></div><button class="btn primary" onclick="addLecture()">Save lecture</button></div><div class="section-title"><h3>My lectures</h3></div><div class="list">${data.lectures.slice().reverse().map((l,i)=>`<div class="item"><div class="itemtop"><b>${esc(l.title)}</b><span class="tag">${esc(l.subject)}</span></div><p class="sub">${esc(l.url)}</p><a class="btn smallbtn" href="${safeUrl(l.url)}" target="_blank" rel="noopener">Open lesson ↗</a> <button class="btn smallbtn ghost danger" onclick="deleteLecture(${data.lectures.length-1-i})">Delete</button></div>`).join("")||'<div class="empty">Save your first lesson link here.</div>'}</div>`);
 }else if(page==="practice"){
 shell("Practice Arena",`<div class="grid g2"><div class="card"><h3>Quick self-test</h3><p class="muted">Create a question for yourself and record whether you got it right. Use your textbook, class notes or PYQs.</p><div class="field"><label>Question / task</label><textarea id="pracQ" placeholder="Write a question to solve..."></textarea></div><div class="field"><label>Subject</label><select id="pracSub">${data.subjects.map(x=>`<option>${esc(x.name)}</option>`).join("")}</select></div><button class="btn primary" onclick="addPractice()">Add to practice list</button></div><div class="card"><h3>Practice guidance</h3><ul class="muted"><li>Attempt without looking at notes first.</li><li>Check answers using your textbook or teacher's solution.</li><li>Log repeated errors in Mistake Notebook.</li><li>Re-attempt incorrect questions later.</li></ul></div></div><div class="section-title"><h3>My practice queue</h3></div><div class="list">${(data.practice||[]).slice().reverse().map((p,i)=>`<div class="item"><div class="itemtop"><b>${esc(p.q)}</b><span class="tag">${esc(p.subject)}</span></div><div class="sub">${esc(p.date)}</div><button class="btn smallbtn" onclick="practiceDone(${(data.practice||[]).length-1-i})">${p.done?"Completed ✓":"Mark attempted"}</button></div>`).join("")||'<div class="empty">Your practice queue is empty.</div>'}</div>`);
 }else if(page==="library"){
 shell("Study Library",`<div class="card"><h3>Save a study resource</h3><p class="muted">Add links to textbooks, PDFs, notes or reference pages. You can also store a short description.</p><div class="field"><label>Resource name</label><input id="resTitle" placeholder="e.g. MP Board Science textbook"></div><div class="row"><div class="field"><label>Type</label><select id="resType"><option>PDF / Book</option><option>Website</option><option>Notes</option><option>Other</option></select></div><div class="field"><label>URL (optional)</label><input id="resUrl" placeholder="https://..."></div></div><button class="btn primary" onclick="addResource()">Save resource</button></div><div class="section-title"><h3>Saved library</h3></div><div class="list">${data.resources.slice().reverse().map((r,i)=>`<div class="item"><div class="itemtop"><b>${esc(r.title)}</b><span class="tag">${esc(r.type)}</span></div><p class="sub">${esc(r.url||"No external link")}</p>${r.url?`<a class="btn smallbtn" href="${safeUrl(r.url)}" target="_blank" rel="noopener">Open ↗</a>`:""} <button class="btn smallbtn ghost danger" onclick="deleteResource(${data.resources.length-1-i})">Delete</button></div>`).join("")||'<div class="empty">Add your study materials here.</div>'}</div>`);
 }else if(page==="ai"){
 shell("AI Study Room",`<div class="hero"><div class="eyebrow">YOUR DOUBT-SOLVING SPACE</div><h2>Study with an AI helper.</h2><p>Open ChatGPT to ask doubts, explain chapters in simple Hinglish, create quizzes or check your answers.</p></div><div class="grid g2"><div class="card"><h3>Open ChatGPT</h3><p class="muted">Ask for step-by-step explanations, MP Board-style answers, revision or practice.</p><a class="btn primary" href="https://chatgpt.com/" target="_blank" rel="noopener">Open ChatGPT ↗</a></div><div class="card"><h3>Suggested prompts</h3><div class="list"><button class="btn" onclick="copyText('Explain this Class 10 MP Board topic in easy Hinglish with examples: ')">Explain a topic</button><button class="btn" onclick="copyText('Give me a Class 10 MP Board chapter test with answers at the end: ')">Create chapter test</button><button class="btn" onclick="copyText('Check my answer like an MP Board examiner and suggest improvements: ')">Check my answer</button></div><p class="sub">Prompt buttons copy a starter prompt. Paste it into ChatGPT and add your topic.</p></div></div>`);
 }else if(page==="analytics"){
 const mins=data.sessions.reduce((n,x)=>n+(x.minutes||0),0),hrs=(mins/60).toFixed(1);
 const bySub=data.subjects.map(sub=>({name:sub.name,done:sub.chapters.filter(c=>c.status==="Completed").length,total:sub.chapters.length}));
 shell("Analytics",`<div class="grid g3">${card("Overall syllabus",`<div class="big">${s.pct}%</div><div class="sub">${s.done}/${s.total} chapters</div>`)}${card("Tracked study time",`<div class="big">${hrs}h</div><div class="sub">From saved focus sessions</div>`)}${card("Practice & mistakes",`<div class="big">${(data.practice||[]).length} / ${data.mistakes.length}</div><div class="sub">Practice items / mistakes logged</div>`)}</div><div class="section-title"><h3>Subject progress</h3></div><div class="card list">${bySub.map(x=>`<div><div class="itemtop"><b>${esc(x.name)}</b><span class="sub">${x.done}/${x.total}</span></div><div class="progress"><span style="width:${x.total?x.done/x.total*100:0}%"></span></div></div>`).join("")}</div><div class="section-title"><h3>Recent focus sessions</h3></div><div class="list">${data.sessions.slice(-10).reverse().map(x=>`<div class="item itemtop"><b>${esc(x.subject)} · ${esc(x.topic)}</b><span class="tag">${x.minutes||0} min</span></div>`).join("")||'<div class="empty">Save focus sessions to see study-time analytics.</div>'}</div>`);
 }else if(page==="customize"){
 shell("Customize",`<div class="grid g2"><div class="card"><h3>Personal settings</h3><div class="field"><label>Your display name</label><input id="setName" value="${esc(data.name)}"></div><div class="field"><label>Target</label><input id="setGoal" value="${esc(data.goal)}"></div><div class="field"><label>Mission start date</label><input type="date" id="setStart" value="${data.startDate}"></div><button class="btn primary" onclick="saveSettings()">Save settings</button></div><div class="card"><h3>Add your own dashboard tool</h3><p class="muted">Add a shortcut to a site or tool you use. It appears on your dashboard.</p><div class="field"><label>Tool name</label><input id="toolName" placeholder="e.g. English practice"></div><div class="field"><label>Short description</label><input id="toolDesc" placeholder="What is it for?"></div><div class="field"><label>URL (optional)</label><input id="toolUrl" placeholder="https://..."></div><button class="btn primary" onclick="addTool()">Add tool</button></div></div><div class="section-title"><h3>My custom tools</h3></div><div class="list">${data.customTools.map((t,i)=>`<div class="item itemtop"><div><b>${esc(t.name)}</b><div class="sub">${esc(t.desc)}</div></div>${t.url?`<a class="btn smallbtn" href="${safeUrl(t.url)}" target="_blank">Open ↗</a>`:""}<button class="btn smallbtn danger ghost" onclick="deleteTool(${i})">Remove</button></div>`).join("")||'<div class="empty">No custom tools yet.</div>'}</div><div class="section-title"><h3>Backup & restore</h3></div><div class="card"><p class="muted">Export a backup to keep your progress safe, or import a previous backup.</p><div class="row"><button class="btn primary" onclick="exportData()">Export backup</button><label class="btn" style="text-align:center">Import backup<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label><button class="btn danger" onclick="resetData()">Reset all data</button></div></div>`);
 }
}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeUrl(u){try{let x=new URL(u);return ["http:","https:"].includes(x.protocol)?x.href:"#"}catch(e){return "#"}}
function tile(i,t,d,p){return `<div class="card tile" onclick="nav('${p}')"><div class="emoji">${i}</div><div><h3>${t}</h3><p>${d}</p></div></div>`}
function todayTasksHTML(){let ts=data.tasks.filter(t=>t.date===todayISO());return ts.map((t,i)=>`<div class="item itemtop"><label class="checkline"><input type="checkbox" ${t.done?"checked":""} onchange="toggleTask(${data.tasks.indexOf(t)},this.checked)"><span>${esc(t.text)} <span class="sub">· ${esc(t.subject)}</span></span></label><button class="btn smallbtn ghost danger" onclick="deleteTask(${data.tasks.indexOf(t)})">×</button></div>`).join("")||'<div class="empty">No tasks added for today. Open My Planner to add your targets.</div>'}
function taskHTML(t,i){return `<div class="item itemtop"><div><b>${esc(t.text)}</b><div class="sub">${esc(t.date)} · ${esc(t.subject)}</div></div><span class="tag ${t.done?"done":"pending"}">${t.done?"Done":"Pending"}</span><button class="btn smallbtn" onclick="toggleTask(${data.tasks.indexOf(t)},${!t.done})">Toggle</button></div>`}
function addTask(){let text=$("#taskText").value.trim();if(!text)return toast("Enter a task first.");data.tasks.push({text,subject:$("#taskSubject").value,date:$("#taskDate").value,done:false});save();render("planner");toast("Task added.")}
function toggleTask(i,v){data.tasks[i].done=v;save();render("planner")}
function deleteTask(i){data.tasks.splice(i,1);save();render("planner")}
function addChapter(){let subject=prompt("Which subject? Enter an exact subject name, or create a new one:");if(!subject)return;let s=data.subjects.find(x=>x.name.toLowerCase()===subject.toLowerCase());if(!s){s={name:subject,chapters:[]};data.subjects.push(s)}s.chapters.push({name:"New chapter",status:"Pending"});save();render("syllabus")}
function renameChapter(si,ci,v){data.subjects[si].chapters[ci].name=v;save();toast("Chapter name saved.")}
function setChapter(si,ci,v){data.subjects[si].chapters[ci].status=v;save();render("syllabus")}
function deleteChapter(si,ci){if(confirm("Delete this chapter?")){data.subjects[si].chapters.splice(ci,1);save();render("syllabus")}}
function addMistake(){let m={subject:$("#mistSubject").value,topic:$("#mistTopic").value.trim(),error:$("#mistError").value.trim(),fix:$("#mistFix").value.trim(),date:new Date().toLocaleDateString(),time:new Date().toLocaleTimeString(),fixed:false};if(!m.error)return toast("Write the mistake first.");data.mistakes.push(m);save();render("mistakes");toast("Mistake saved with date and time.")}
function toggleMistake(i){data.mistakes[i].fixed=!data.mistakes[i].fixed;save();render("mistakes")}
function removeMistake(i){data.mistakes.splice(i,1);save();render("mistakes")}
function addNote(){let n={title:$("#noteTitle").value.trim()||"Untitled note",subject:$("#noteSubject").value,body:$("#noteBody").value,date:new Date().toLocaleDateString(),time:new Date().toLocaleTimeString()};if(!n.body.trim())return toast("Write something in your note.");data.notes.push(n);save();render("notes");toast("Note saved.")}
function deleteNote(i){data.notes.splice(i,1);save();render("notes")}
function addLecture(){let l={title:$("#lecTitle").value.trim(),subject:$("#lecSubject").value,url:$("#lecUrl").value.trim()};if(!l.title||!l.url)return toast("Enter lecture title and URL.");data.lectures.push(l);save();render("lectures");toast("Lecture link saved.")}
function deleteLecture(i){data.lectures.splice(i,1);save();render("lectures")}
function addResource(){let r={title:$("#resTitle").value.trim(),type:$("#resType").value,url:$("#resUrl").value.trim()};if(!r.title)return toast("Enter a resource name.");data.resources.push(r);save();render("library");toast("Resource saved.")}
function deleteResource(i){data.resources.splice(i,1);save();render("library")}
function addPractice(){let q=$("#pracQ").value.trim();if(!q)return toast("Enter a question or practice task.");data.practice=data.practice||[];data.practice.push({q,subject:$("#pracSub").value,date:todayISO(),done:false});save();render("practice")}
function practiceDone(i){data.practice=data.practice||[];data.practice[i].done=!data.practice[i].done;save();render("practice")}
function addTool(){let name=$("#toolName").value.trim();if(!name)return toast("Enter a tool name.");data.customTools.push({name,desc:$("#toolDesc").value,url:$("#toolUrl").value});save();render("customize");toast("Custom tool added.")}
function deleteTool(i){data.customTools.splice(i,1);save();render("customize")}
function saveSettings(){data.name=$("#setName").value;data.goal=$("#setGoal").value;data.startDate=$("#setStart").value||data.startDate;save();render("customize");toast("Settings saved.")}
function toggleDaily(i,v){let a=data.dailyChecks[todayISO()]||[];data.dailyChecks[todayISO()]=v?[...new Set([...a,i])]:a.filter(x=>x!==i);save()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="project-eclipse-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data={...defaultData,...JSON.parse(r.result)};save();render("home");toast("Backup imported.")}catch(err){toast("Invalid backup file.")}};r.readAsText(f)}
function resetData(){if(confirm("This will erase this browser's saved Project Eclipse data. Export a backup first. Continue?")){localStorage.removeItem("eclipseData");data=structuredClone(defaultData);save();render("home")}}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast("Prompt copied.")).catch(()=>toast(t))}
let timerSeconds=25*60,timerInitial=25*60,timerInterval=null,swStart=null,swElapsed=0,swInterval=null;
function setTimer(min,b){if(timerInterval)clearInterval(timerInterval);timerInterval=null;timerSeconds=min*60;timerInitial=timerSeconds;$("#timerDisplay").textContent=clock(timerSeconds);$("#timerStart").textContent="Start";document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("#timerStatus").textContent="Timer ready."}
function clock(n){return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function toggleTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;$("#timerStart").textContent="Resume";return}$("#timerStart").textContent="Pause";$("#timerStatus").textContent="Focus in progress.";timerInterval=setInterval(()=>{timerSeconds--;$("#timerDisplay").textContent=clock(timerSeconds);if(timerSeconds<=0){clearInterval(timerInterval);timerInterval=null;$("#timerStart").textContent="Start";$("#timerStatus").textContent="Session complete. Save it in the session panel.";beep()}},1000)}
function resetTimer(){clearInterval(timerInterval);timerInterval=null;timerSeconds=timerInitial;$("#timerDisplay").textContent=clock(timerSeconds);$("#timerStart").textContent="Start";$("#timerStatus").textContent="Timer reset."}
function beep(){try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.value=.08;o.start();o.stop(c.currentTime+.25)}catch(e){}}
function stopwatchToggle(){if(swInterval){clearInterval(swInterval);swInterval=null;$("#stopBtn").textContent="Resume";return}swStart=Date.now()-swElapsed;swInterval=setInterval(()=>{swElapsed=Date.now()-swStart;let s=Math.floor(swElapsed/1000);$("#stopDisplay").textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,"0")).join(":")},250);$("#stopBtn").textContent="Pause"}
function stopwatchReset(){clearInterval(swInterval);swInterval=null;swElapsed=0;$("#stopDisplay").textContent="00:00:00";$("#stopBtn").textContent="Start"}
function saveSession(){let topic=$("#sessionTopic").value.trim(),subject=$("#sessionSubject").value;let mins=timerInitial/60-timerSeconds/60;if(swElapsed>0)mins=Math.round(swElapsed/60000);if(mins<=0)mins=timerInitial/60;data.sessions.push({subject,topic,date:new Date().toLocaleDateString(),time:new Date().toLocaleTimeString(),minutes:Math.max(1,Math.round(mins)),duration:Math.max(1,Math.round(mins))+" min"});save();render("focus");toast("Study session saved.")}
function init(){if(!data.practice)data.practice=[];save();render("home");if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});}
init();
</script>
</body></html>
